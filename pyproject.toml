[project]
name = "security-robot-rl-backend"
version = "0.1.0"
description = "FastAPI backend for the security robot reinforcement learning system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.34",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "celery>=5.4.0",
  "redis>=5.0.8",
  "numpy>=1.26.4",
  "gymnasium>=0.29.1"
]

[project.optional-dependencies]
development = [
  "pytest>=8.3.0",
  "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
