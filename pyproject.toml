[project]
name = "security-robot-rl-backend"
version = "0.1.0"
description = "FastAPI backend for the security robot reinforcement learning system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.34",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "celery>=5.4.0",
  "redis>=5.0.8",
  "numpy>=1.26.4",
  "gymnasium>=0.29.1",
  "psycopg[binary]>=3.2.3",
  "python-multipart>=0.0.9",
  "tqdm>=4.67.0",
  "rich>=13.9.0",
  "alembic>=1.17.2",
]

[project.optional-dependencies]
development = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.0.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0"
]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  "app*",
  "rl*",
]
exclude = [
  "tests*",
  "docker*",
  "instructions*",
  "report*",
  "scripts*",
]

[tool.ruff]
exclude = [
    ".venv",
    ".ruff_cache"
]
target-version = "py311"
indent-width = 2
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "B008",  # do not perform function calls in argument defaults
  "W191",  # indentation contains tabs
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/*.py" = ["E402"]  # module level imports after sys.path.append

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app", "rl", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-sort-within-sections = true

[tool.pytest.ini_options]
markers = [
  "integration: tests that interact with multiple components or longer-running flows",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=1.18.2",
]
