services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
      # DNS 制限下でも apt-get が利用できるようビルド時のみホストネットワークを使用
      network: host
    user: appuser
    ports:
      - '8000:8000'
    volumes:
      - ../:/app
      - venv_data:/app/.venv
      - ../models:/app/models
      - ../logs:/app/logs
      - ../playback_data:/app/playback_data
      - storage_data:/app/storage
    environment:
      - 'DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://security_robot:change_me@postgres:5432/security_robot}'
      - 'REDIS_URL=${REDIS_URL:-redis://redis:6379/0}'
      - 'CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - python docker/check_api_health.py
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    privileged: true

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
      # DNS 制限下でも apt-get が利用できるようビルド時のみホストネットワークを使用
      network: host
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=info
      - -P
      - solo
    user: appuser
    volumes:
      - ../:/app
      - venv_data:/app/.venv
      - ../models:/app/models
      - ../logs:/app/logs
      - ../playback_data:/app/playback_data
      - storage_data:/app/storage
    environment:
      - 'DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://security_robot:change_me@postgres:5432/security_robot}'
      - 'REDIS_URL=${REDIS_URL:-redis://redis:6379/0}'
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    privileged: true

  postgres:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER:-security_robot}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}'
      - 'POSTGRES_DB=${POSTGRES_DB:-security_robot}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🔹 Ruff 専用サービス（公式イメージ使用）
  ruff:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ruff
    image: security-robot-be-ruff
    profiles: ["tools"]
    volumes:
      - ../:/app

volumes:
  postgres_data:
  venv_data:
  storage_data:
