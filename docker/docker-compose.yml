version: '3.9'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --reload
    ports:
      - '8000:8000'
    volumes:
      - ../:/app
      - ../models:/app/models
      - ../logs:/app/logs
      - ../playback_data:/app/playback_data
    environment:
      - DATABASE_URL=postgresql+asyncpg://security_robot:security_robot_password@postgres:5432/security_robot
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    volumes:
      - ../:/app
      - ../models:/app/models
      - ../logs:/app/logs
      - ../playback_data:/app/playback_data
    environment:
      - DATABASE_URL=postgresql+asyncpg://security_robot:security_robot_password@postgres:5432/security_robot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=security_robot
      - POSTGRES_PASSWORD=security_robot_password
      - POSTGRES_DB=security_robot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d security_robot -U security_robot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  models:
  logs:
  playback_data:
